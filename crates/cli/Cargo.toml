[package]
name = "mcp-mesh"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
mcp-mesh-core = { path = "../core" }
mcp-mesh-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-std", "io-util", "net", "time"] }
# Only used by the tests/fixtures echo_server [[bin]] below (Cargo doesn't
# allow [[bin]] targets to draw on [dev-dependencies]); never referenced by
# the mcp-mesh library/binary logic itself.
signal-hook = "0.3"

[[bin]]
name = "echo_server"
path = "../core/tests/fixtures/echo_server.rs"
