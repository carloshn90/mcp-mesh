[package]
name = "mcp-mesh-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
mcp-mesh-protocol = { path = "../protocol" }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["process", "time", "sync", "rt", "io-util", "macros"] }
nix = { version = "0.29", features = ["signal"] }
# Only used by the tests/fixtures/echo_server.rs test-helper binary below
# (Cargo doesn't allow [[bin]] targets to draw on [dev-dependencies]); never
# referenced by the library, so it never reaches the shipped mcp-mesh CLI.
signal-hook = "0.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }

[[bin]]
name = "echo_server"
path = "tests/fixtures/echo_server.rs"

[[bench]]
name = "gateway_latency"
harness = false
