[workspace]
resolver = "2"
members = ["crates/protocol", "crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/carloshn/mcp-mesh"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
strip = true
